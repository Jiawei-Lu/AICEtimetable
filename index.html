<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AICE Timetable AY26/27</title>
<style>
:root{--ink:#17222d;--mute:#66727e;--line:#dfe4e9;--acc:#2457d6;--paper:#fff}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#e7ebef;color:var(--ink);font-family:"Bahnschrift","DIN Alternate","Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}
#app{max-width:1440px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:16px}
h1{margin:0;font-size:clamp(24px,3.2vw,36px);font-weight:600;letter-spacing:-.01em}
#status{margin:4px 0 0;font-size:13px;color:var(--mute);min-height:18px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pill{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
button{font:inherit;cursor:pointer;border:0;background:transparent;color:var(--ink);padding:7px 14px;border-radius:999px;font-size:14px}
button:hover{background:#eef2f6}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pill button.on{background:var(--ink);color:#fff}
.ghost{border:1px solid var(--line);background:var(--paper)}
.wrap{display:grid;grid-template-columns:190px 1fr;gap:16px;align-items:start}
#legend{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;position:sticky;top:12px}
.lg h3{margin:0 0 6px;font-size:13px;font-weight:600}
.lg{margin-bottom:14px}
.lgi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:4px 6px;border-radius:6px;font-size:13px}
.lgi.off{opacity:.35;text-decoration:line-through}
.sw2{display:inline-flex;gap:2px}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;background-color:#c8cfd6;border:1px solid rgba(0,0,0,.15)}
.st,.chip.prac{background-image:repeating-linear-gradient(135deg,var(--b,#17222d) 0 3px,#fff 3px 6px);background-repeat:no-repeat}
.st{background-size:40% 100%}.chip.prac{background-size:12px 100%;padding-left:16px}
.ev.prac{padding-left:22px}
.ev.prac::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8%;min-width:8px;max-width:14px;background:repeating-linear-gradient(135deg,var(--b) 0 3px,#fff 3px 6px);pointer-events:none}
.ev.prac>*{position:relative}
.key{margin:6px 0 0;font-size:11px;color:var(--mute);line-height:1.9}
#main{min-width:0}
.sc{background:var(--paper);border:1px solid var(--line);border-radius:10px;max-height:680px;overflow:auto}
.g{display:grid;min-width:760px}
.hd{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 6px 8px;text-align:left;font-size:14px;font-weight:600;box-shadow:inset 0 -3px 0 transparent}
.hd.w{color:var(--mute);font-size:13px;text-align:center}
.hd.today{box-shadow:inset 0 -3px 0 var(--acc);color:var(--acc)}
.hd .b{display:block;font-size:11px;color:var(--mute);font-weight:400}
.ax div{height:44px;text-align:center;padding-top:4px;font-size:12px;color:var(--mute);border-top:1px solid var(--line)}
.col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(0deg,var(--line) 0 1px,transparent 1px 44px)}
.col.today{background-color:#f5f8ff}
.ev{position:absolute;padding:6px 8px 6px 10px;border:0;border-left:5px solid rgba(0,0,0,.3);border-radius:6px;font-size:12.5px;line-height:1.3;overflow:hidden;cursor:pointer;text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.ev:hover{filter:brightness(.95)}
.ev b{display:block;font-size:13px}
.ev small{display:block;opacity:.8;margin-top:2px}
.mg{display:grid;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mh{padding:8px;font-size:13px;color:var(--mute);border-bottom:1px solid var(--line)}
.mc{min-height:100px;padding:5px;border-top:1px solid var(--line);border-left:1px solid var(--line);font-size:12px}
.mc.out{background:#f6f8fa;color:#a5adb5}.mc.today{background:#f5f8ff}
.mc b{display:block;margin-bottom:3px}
.chip{display:block;width:100%;text-align:left;margin-top:2px;padding:2px 6px;border-radius:4px;font-size:11px}
#ov{position:fixed;inset:0;background:rgba(23,34,45,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#ov.show{display:flex}
#dlg{background:#fff;border-radius:12px;max-width:460px;width:100%;padding:22px;max-height:90vh;overflow:auto}
#dlg h2{margin:0 0 12px;font-size:18px}
#dlg dl{margin:0;display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:13px}
#dlg dt{color:var(--mute)}#dlg dd{margin:0}
#dlg .close{background:var(--ink);color:#fff}
@media(max-width:820px){.wrap{grid-template-columns:1fr}#legend{position:static;display:flex;flex-wrap:wrap;gap:4px 18px}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0 12px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-size:26px;font-weight:600}.kpi span{font-size:12px;color:var(--mute)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.ch h2{margin:0;font-size:15px;font-weight:600}
.card svg{width:100%;height:auto;display:block}.card svg text{font-family:inherit;fill:var(--mute);font-size:11px}
.key2{font-size:12px;color:var(--mute);display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}
.key2 i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-1px}
@media(max-width:520px){.cards{grid-template-columns:1fr}}
.cb{flex:none;width:16px;height:16px;border:1.5px solid var(--ink);border-radius:4px;background:#fff;position:relative}
.lgi:not(.off) .cb{background:var(--ink)}
.lgi:not(.off) .cb::after{content:"";position:absolute;left:4px;top:0;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.lgi.off{opacity:1}.lgi.off .sw2,.lgi.off .lt{opacity:.4;text-decoration:line-through}
.key{margin-top:8px;padding-top:10px;border-top:1px solid var(--line);text-align:left}
.kr{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;font-size:12px;color:var(--mute);line-height:1.3}
.kr .sw{flex:none}
.ev .rq{margin-top:3px;opacity:1;font-style:italic}
.ch{flex-wrap:wrap}.ch .lgi{width:auto}.ch .ctl{gap:2px}
.kpi.wide{grid-column:span 2}.kpi .two{display:flex;gap:28px;flex-wrap:wrap}
.kpi .note{margin:8px 0 0;font-size:11.5px;color:var(--mute);line-height:1.5}
@media(max-width:520px){.kpi.wide{grid-column:auto}}
.ev{overflow:hidden}
.ev .l{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .l b{display:inline;font-size:13px}
.ev .sub{opacity:.85;font-size:11.5px;margin-top:2px}
.ev .more{display:none;font-size:11.5px;margin-top:6px;padding-top:6px;border-top:1px solid rgba(128,128,128,.5);line-height:1.5}
.ev:hover,.ev:focus-visible{z-index:40;overflow:visible;height:auto!important;left:3px!important;width:calc(100% - 6px)!important;box-shadow:0 10px 28px rgba(23,34,45,.35)}
.ev:hover .l,.ev:focus-visible .l{white-space:normal;overflow:visible}
.ev:hover .more,.ev:focus-visible .more{display:block}
.kpi.wide{position:relative}
.info-i{position:absolute;right:10px;bottom:10px;width:22px;height:22px;padding:0;border-radius:50%;background:#6c8fc4;color:#fff;font:700 13px/22px Georgia,serif;text-align:center}
.info-i:hover{background:#4d74b3}
.kpi .note{padding-right:34px}
.ev .np{display:inline-block;background:#fff;color:#a30f0f;font-weight:800;font-size:11px;padding:0 6px;border-radius:3px;margin-top:2px}
.ev .ok{display:inline-block;font-size:11px;opacity:.85;margin-top:2px}
.ev .cut{visibility:hidden}.ev:hover .cut,.ev:focus-visible .cut{visibility:visible}
.kpi small{display:block;font-size:11px;color:var(--mute);margin-top:2px}
.kpi .badge{position:absolute;top:12px;right:12px;max-width:140px;text-align:right;background:#eef3ff;border:1px solid #c6d5fa;border-radius:10px;padding:7px 11px}
.kpi .badge b{display:block;font-size:24px;line-height:1.1;color:var(--acc)}
.kpi .badge span{font-size:12px;font-weight:600;color:var(--ink)}
.kpi .badge small{margin-top:1px;font-size:10.5px}
@media(max-width:520px){.kpi .badge{position:static;max-width:none;text-align:left;margin-bottom:8px}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div><h1 id="title">Loading…</h1><p id="status"></p></div>
    <div class="ctl">
      <div class="pill"><button id="prev" aria-label="Previous">&lsaquo;</button><button id="today">Today</button><button id="next" aria-label="Next">&rsaquo;</button></div>
      <div class="pill"><button data-view="day">Day</button><button data-view="week">Week</button><button data-view="month">Month</button></div>
      <div class="pill"><button data-sem="S1">Semester 1</button><button data-sem="S2">Semester 2</button></div>
      <button id="wk" class="ghost">Show Weekends</button>
    </div>
  </header>
  <div class="wrap"><aside id="legend" aria-label="Colour key"></aside><div id="main"></div></div>
  <section id="stats" aria-label="Lab usage statistics">
    <div class="kpis" id="kpis"></div>
    <div class="cards">
      <div class="card"><div class="ch"><h2>Students timetabled per week</h2><div class="ctl"><button class="lgi" role="checkbox" data-line="S1"><span class="cb"></span><span class="sw" style="background-color:#2457d6"></span><span class="lt">Semester 1</span></button><button class="lgi" role="checkbox" data-line="S2"><span class="cb"></span><span class="sw" style="background-color:#17915f"></span><span class="lt">Semester 2</span></button></div><div class="pill"><button data-mode="weekly" class="on">Weekly</button><button data-mode="cum">Cumulative</button></div></div><div id="lineChart"></div></div>
      <div class="card"><div class="ch"><h2 id="barTitle">Seat occupancy</h2></div><div id="barChart"></div><div class="key2"><span><i style="background:#1f3a5f"></i>Occupied</span><span><i style="background:#cdeaf2"></i>Remaining</span><span><i style="background:#c0392b"></i>Over capacity</span></div></div>
    </div>
  </section>
</div>
<div id="ov"><div id="dlg" role="dialog" aria-modal="true"></div></div>

<script>
(() => {
const START = 8, END = 21, HPX = 44;
const DAYS = {mon:1,tue:2,wed:3,thu:4,fri:5,sat:6,sun:7};
const DN = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $ = id => document.getElementById(id);
const S = {pat:[], tt:[], cfg:{defaultSemester:'S1'}, view:'week', weekends:false, date:new Date(), hide:new Set(), mode:'weekly', lines:{S1:true,S2:true}, note:false};

/* ---------- data ---------- */
function parseCSV(t){
  const out=[]; let row=[], f='', q=false; t=t.replace(/^\uFEFF/,'');
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++} else q=false } else f+=c }
    else if(c==='"') q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n')i++; row.push(f); out.push(row); row=[]; f='' }
    else f+=c;
  }
  if(f||row.length){row.push(f);out.push(row)}
  return out.filter(r=>r.some(v=>v.trim()));
}
function toObjs(rows, suffixDupes){
  const seen={};
  const head=rows[0].map(h=>{
    h=h.trim();
    if(suffixDupes && /^(SW|HW|EW|CW)\d+$/.test(h)){ seen[h]=(seen[h]||0)+1; return h+(seen[h]===1?'_S1':'_S2') }
    return h;
  });
  return rows.slice(1).map(r=>{const o={}; head.forEach((h,i)=>o[h]=(r[i]||'').trim()); return o});
}
function ukDate(s){const p=(s||'').split('/'); return p.length===3?new Date(+p[2],+p[1]-1,+p[0]):null}

/* Semester column in Week-Pattern: "Semester 1", "Semester 2", then "Semester 3…19" (autofill
   artefact). Anything numbered 2 or above is the second-semester calendar. */
function loadPattern(text){
  S.pat = toObjs(parseCSV(text)).map(o=>{
    const n = +((o['Semester'].match(/\d+/)||[0])[0]);
    const start=ukDate(o['Week Start Date']), end=ukDate(o['Week End Date']);
    if(!start||!end||!n) return null;
    end.setHours(23,59,59,999);
    return {label:o['Week Label'].trim(), sem:n===1?'S1':'S2', type:o['Week Type'].trim(), start, end};
  }).filter(Boolean);
}
function weekOf(d){ return S.pat.find(w=>d>=w.start && d<=w.end) || null }
function mondayOf(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x }
const same=(a,b)=>a.toDateString()===b.toDateString();
const addDays=(d,n)=>{const x=new Date(d); x.setDate(x.getDate()+n); return x};
const ord=n=>n+(n%10===1&&n!==11?'st':n%10===2&&n!==12?'nd':n%10===3&&n!==13?'rd':'th');
const wLabel=l=>!l?'--':(l[0]==='S'?'W'+ +l.slice(2):l[0]+'W'+ +l.slice(2));
const typeCls=t=>/practical/i.test(t)?'P':/computer/i.test(t)?'C':'O';
const typeTag=t=>/practical/i.test(t)?(/computer/i.test(t)?'P+C':'P'):/computer/i.test(t)?'C':'';
const hm=h=>{const H=Math.floor(h),M=Math.round((h-H)*60);return String(H).padStart(2,'0')+':'+String(M).padStart(2,'0')};

/* events for one calendar date */
function eventsFor(d,all){
  const w=weekOf(d); if(!w) return {w:null,ev:[]};
  const dow=(d.getDay()+6)%7+1, key=w.label+'_'+w.sem, map={};
  S.tt.forEach(r=>{
    if(r['Semester'].toUpperCase()!==w.sem || r[key]!=='1') return;
    if(DAYS[r['Day of Week'].slice(0,3).toLowerCase()]!==dow || (!all&&S.hide.has(rowKey(r)))) return;
    const s=parseFloat(r['Start Time']), e=parseFloat(r['End Time']);
    if(isNaN(s)||isNaN(e)) return;
    const k=[s,e,r['Name'],r['Lab Type']].join('|');
    (map[k]=map[k]||{s,e,name:r['Name'],type:r['Lab Type'],rows:[]}).rows.push(r);
  });
  const ev=Object.values(map).map(g=>{
    const mods=g.rows.map(r=>r['Module']);
    g.code=mods.map((m,i)=>i&&m.replace(/^[A-Z]+/,'')!==m&&mods[0].slice(0,4)===m.slice(0,4)?m.replace(/^[A-Z]+/,''):m).join('/');
    g.name=mods.length>1&&g.rows.length>1?'':g.name; g.w=w; g.date=d; return g;
  });
  layout(ev);
  return {w,ev};
}
function layout(ev){
  ev.sort((a,b)=>a.s-b.s||a.e-b.e);
  let cur=null,mx=-1;
  ev.forEach(e=>{
    if(!cur||e.s>=mx){cur={lanes:[]};mx=-1}
    let l=cur.lanes.findIndex(x=>x<=e.s); if(l<0){l=cur.lanes.length;cur.lanes.push(0)}
    cur.lanes[l]=e.e; e.lane=l; e.cl=cur; mx=Math.max(mx,e.e);
  });
}

/* ---------- rendering ---------- */
/* colour: each programme owns one base colour (the left edge of its blocks). Year sets how much
   white is mixed into the fill (Year 6 = the pure base colour, Year 1 = palest). Practical labs
   use the same fill a little darker plus stripes. Unknown programmes take the reserved colours in
   order of first appearance in the CSV, or an override in config.json: "programmeColours". */
const BASE={AICE:'#ff6b59',ELEC:'#74C9E5',FEEG:'#954e9b'};
const RESERVE=['#f0b429','#4cb782','#5867d6'];
const TINT=[0,.78,.6,.42,.28,.14,0];
const hex2=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mixc=(c,t,k)=>c.map((v,i)=>Math.round(v+(t[i]-v)*k));
const lum=c=>{const f=v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4};return .2126*f(c[0])+.7152*f(c[1])+.0722*f(c[2])};
function baseOf(p){
  const cm=S.cfg.programmeColours||{}; if(cm[p]) return cm[p]; if(BASE[p]) return BASE[p];
  const un=(S.progs||[]).filter(x=>!BASE[x]&&!cm[x]); return RESERVE[Math.max(0,un.indexOf(p))%RESERVE.length];
}
const yearOf=m=>+((m.match(/\d/)||[0])[0]);
function pal(prog,y,type){
  const base=baseOf(prog), prac=/practical/i.test(type);
  let c=mixc(hex2(base),[255,255,255],TINT[Math.min(Math.max(y,1),6)]);
  if(prac) c=mixc(c,[0,0,0],.12);
  const L=lum(c), dark=(L+.05)/.064, white=1.05/(L+.05);
  return {bg:`rgb(${c})`, fg:dark>=white?'#14202a':'#fff', prac, base};
}
const rowKey=r=>r['Programmes']+'|'+yearOf(r['Module']);
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function evHTML(e,idx,dayKey){
  const n=e.cl.lanes.length, wd=100/n, r=e.rows[0], c=pal(r['Programmes'],yearOf(r['Module']),e.type), h=(e.e-e.s)*HPX-1;
  const u=k=>esc([...new Set(e.rows.map(r=>r[k]).filter(x=>x&&x.toUpperCase()!=='NA'))].join('; '));
  const prog=esc([...new Set(e.rows.map(r=>r['Programmes']))].join(', ')), rq=u('Requirements'), pr=u('Preparation Requirement'), st=e.rows.some(r=>r['Requirement Status']!=='Prepared');
  const more=`<span class="more">${prog} · ${hm(e.s)}–${hm(e.e)}<br>Students: ${stu(e)}${pr?'<br>Preparation: '+pr:''}</span>`;
  return `<button class="ev${c.prac?' prac':''}" data-k="${dayKey}:${idx}" style="background-color:${c.bg};color:${c.fg};border-left-color:${c.base};--b:${c.base};top:${(e.e>e.s?(e.s-START)*HPX:0)}px;height:${h}px;min-height:${h}px;left:calc(${e.lane*wd}% + 3px);width:calc(${wd}% - 6px);--l:calc(${e.lane*wd}% + 3px)"><span class="l"><b>${e.code}</b> ${esc(e.name||'')}</span><span class="l">${st?'<span class="np">Not prepared</span>':'<span class="ok">Prepared</span>'}</span><span class="l">${/practical/i.test(e.type)?`<span class="np">${esc(e.type)}</span>`:`<span class="ok">${esc(e.type||'Computer')}</span>`}</span>${rq?`<span class="l rq">Requirements: ${rq}</span>`:''}${more}</button>`;
}
function chipHTML(e,key,i){const r=e.rows[0],c=pal(r['Programmes'],yearOf(r['Module']),e.type);return `<button class="chip${c.prac?' prac':''}" style="background-color:${c.bg};color:${c.fg};border-left:4px solid ${c.base};--b:${c.base}" data-k="${key}:${i}">${e.code}</button>`}
function renderLegend(){
  const m={}; S.tt.forEach(r=>{const p=r['Programmes'],y=yearOf(r['Module']);m[p]=m[p]||{};m[p][y]=m[p][y]||{};m[p][y][/practical/i.test(r['Lab Type'])?'p':'c']=1});
  $('legend').innerHTML=Object.keys(m).sort().map(p=>`<div class="lg"><h3>${p}</h3>`+Object.keys(m[p]).sort().map(y=>{const o=m[p][y];
    const off=S.hide.has(p+'|'+y);
    return `<button class="lgi${off?' off':''}" role="checkbox" aria-checked="${!off}" data-hide="${p}|${y}"><span class="cb"></span><span class="sw2">${o.c?`<span class="sw" style="background-color:${pal(p,+y,'Computer').bg}"></span>`:''}${o.p?`<span class="sw st" style="background-color:${pal(p,+y,'Practical').bg};--b:${pal(p,+y,'Practical').base}"></span>`:''}</span><span class="lt">Part ${["","I","II","III","IV","V","VI"][+y]||y}</span></button>`}).join('')+'</div>').join('')
    +'<div class="key"><div class="kr"><span class="sw"></span><span>Computer</span></div><div class="kr"><span class="sw st"></span><span>Practical, Practical and Computer</span></div></div>';
}
function fitBlocks(){
  document.querySelectorAll('.ev').forEach(ev=>{const H=ev.clientHeight;
    ev.querySelectorAll('.l').forEach(l=>l.classList.toggle('cut',l.offsetTop+l.offsetHeight>H-3))});
}
const store={};
function dayCol(d,today){
  const {ev}=eventsFor(d), key=d.toISOString().slice(0,10); store[key]=ev;
  return `<div class="col${same(d,today)?' today':''}" style="height:${(END-START)*HPX}px">${ev.map((e,i)=>evHTML(e,i,key)).join('')}</div>`;
}
function renderTime(days){
  const today=new Date(), first=days[0], info=eventsFor(first).w||weekOf(mondayOf(first));
  const cols=`56px repeat(${days.length},minmax(120px,1fr))`;
  let h=`<div class="g" style="grid-template-columns:${cols}"><div class="hd w">${wLabel(info&&info.label)}</div>`;
  days.forEach(d=>{
    const w=weekOf(d), bad=w&&w.type!=='Teaching'?`<span class="b">${w.type}</span>`:(!w?'<span class="b">no term</span>':'');
    h+=`<div class="hd${same(d,today)?' today':''}">${DN[(d.getDay()+6)%7]} ${ord(d.getDate())} ${MN[d.getMonth()]}${bad}</div>`;
  });
  let ax=''; for(let x=START;x<END;x++) ax+=`<div class="h">${x<12?x+'am':x===12?'12pm':(x-12)+'pm'}</div>`;
  h+=`<div class="ax">${ax}</div>`+days.map(d=>dayCol(d,today)).join('')+'</div>';
  $('main').innerHTML=`<div class="sc" id="sc">${h}</div>`;
  const sc=$('sc'); sc.scrollTop=(10-START)*HPX-20; fitBlocks();
}
function renderMonth(){
  const today=new Date(), y=S.date.getFullYear(), m=S.date.getMonth(), n=S.weekends?7:5;
  let d=mondayOf(new Date(y,m,1)), h=`<div class="mg" style="grid-template-columns:repeat(${n},1fr)">`;
  DN.slice(0,n).forEach(x=>h+=`<div class="mh">${x}</div>`);
  for(;d<=new Date(y,m+1,0)||(d.getDay()!==1);d=addDays(d,1)){
    const dow=(d.getDay()+6)%7; if(dow>=n) continue;
    const {ev}=eventsFor(d), key=d.toISOString().slice(0,10); store[key]=ev;
    h+=`<div class="mc${d.getMonth()!==m?' out':''}${same(d,today)?' today':''}"><b>${d.getDate()}</b>${ev.map((e,i)=>chipHTML(e,key,i)).join('')}</div>`;
  }
  $('main').innerHTML=h+'</div>';
}
function render(){
  const v=S.view, d=S.date;
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  const w=weekOf(v==='month'?d:v==='day'?d:mondayOf(d));
  document.querySelectorAll('[data-sem]').forEach(b=>b.classList.toggle('on',!!w&&b.dataset.sem===w.sem));
  $('wk').style.display=v==='day'?'none':'';
  if(v==='month'){
    renderMonth(); $('title').textContent=['January','February','March','April','May','June','July','August','September','October','November','December'][d.getMonth()]+' '+d.getFullYear();
  } else if(v==='day'){
    renderTime([d]); $('title').textContent=`${DN[(d.getDay()+6)%7]} ${d.getDate()} ${MN[d.getMonth()]} ${d.getFullYear()}`;
  } else {
    const mon=mondayOf(d), n=S.weekends?7:5, days=Array.from({length:n},(_,i)=>addDays(mon,i)), e=days[n-1];
    renderTime(days);
    $('title').textContent=`${MN[mon.getMonth()]} ${mon.getDate()} – ${e.getMonth()!==mon.getMonth()?MN[e.getMonth()]+' ':''}${e.getDate()}, ${e.getFullYear()}`;
  }
  const wi=weekOf(v==='week'?mondayOf(d):d);
  $('status').textContent=wi?`${wi.sem==='S1'?'Semester 1':'Semester 2'} · ${wi.label} · ${wi.type}`:'Outside the term calendar';
  renderStats();
}

/* ---------- details dialog ---------- */
function showDetail(k){
  const [dk,i]=k.split(':'), e=store[dk][+i]; if(!e) return;
  const rows=e.rows.map(r=>`<dt>Module</dt><dd>${r['Module']} – ${r['Name']}</dd><dt>Programmes</dt><dd>${r['Programmes']||'–'}</dd><dt>Students</dt><dd>${r['Total Student Number']||'–'}</dd><dt>Preparation</dt><dd>${r['Preparation Requirement']||'–'}</dd><dt>Requirements</dt><dd>${r['Requirements']||'–'}</dd><dt>Status</dt><dd>${r['Requirement Status']||'–'}</dd>`).join('');
  $('dlg').innerHTML=`<h2>${e.code}${e.name?' – '+e.name:''}</h2><dl><dt>Date</dt><dd>${DN[(e.date.getDay()+6)%7]} ${ord(e.date.getDate())} ${MN[e.date.getMonth()]} ${e.date.getFullYear()}</dd><dt>Time</dt><dd>${hm(e.s)} – ${hm(e.e)}</dd><dt>Week</dt><dd>${e.w.label} (${e.w.sem})</dd><dt>Lab type</dt><dd>${e.type||'–'}</dd>${rows}</dl><p style="text-align:right;margin:14px 0 0"><button id="cls" class="close">Close</button></p>`;
  $('ov').classList.add('show'); $('cls').focus();
}
const closeDlg=()=>$('ov').classList.remove('show');

/* ---------- statistics ---------- */
const stu=g=>g.rows.reduce((a,r)=>a+(+r['Total Student Number']||0),0);
const peak=(ev,a,b)=>{let m=0;for(let t=a;t<b;t+=.5)m=Math.max(m,ev.filter(e=>e.s<=t&&t<e.e).reduce((x,e)=>x+stu(e),0));return m};
const dm=d=>d.getDate()+' '+MN[d.getMonth()];
function weekData(w){
  let total=0,sessions=0,prep=0; const slots=[];
  for(let i=0;i<5;i++){
    const d=addDays(w.start,i), ev=eventsFor(d,true).ev;
    ev.forEach(e=>{total+=stu(e);sessions++;if(e.rows.some(r=>r['Requirement Status']!=='Prepared'))prep++});
    const wed=i===2; slots.push({d,am:peak(ev,9,13),pm:peak(ev,13,17),am2:wed?peak(ev,9,12):peak(ev,9,13),pm2:wed?null:peak(ev,13,17)});
  }
  return {w,total,sessions,prep,slots};
}
const LC={S1:'#2457d6',S2:'#17915f'};
function lineChart(bySem,cur,curSem){
  const ms=['S1','S2'].filter(m=>S.lines[m]);
  if(!ms.length) return '<p style="color:var(--mute)">Tick at least one semester to draw a line.</p>';
  const vals={}; ms.forEach(m=>{let v=(bySem[m]||[]).map(x=>x.total); if(S.mode==='cum'){let a=0;v=v.map(x=>a+=x)} vals[m]=v});
  const n=Math.max(1,...['S1','S2'].map(m=>(bySem[m]||[]).length));
  const W=720,H=330,l=56,r=20,t=18,b=66,mx=Math.max(1,...ms.flatMap(m=>vals[m])),p=10**Math.floor(Math.log10(mx))/2,top=Math.ceil(mx*1.05/p)*p;
  const X=i=>l+(n>1?i*(W-l-r)/(n-1):(W-l-r)/2), Y=x=>t+(H-t-b)*(1-x/top);
  let o=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Students timetabled per week, by semester">`;
  for(let k=0;k<=4;k++){const g=top*k/4;o+=`<line x1="${l}" x2="${W-r}" y1="${Y(g)}" y2="${Y(g)}" stroke="#dfe4e9"/><text x="${l-8}" y="${Y(g)+4}" text-anchor="end">${Math.round(g)}</text>`}
  ms.forEach(m=>{
    const v=vals[m], wk=bySem[m]||[];
    o+=`<polyline fill="none" stroke="${LC[m]}" stroke-width="2.5" stroke-linejoin="round" points="${v.map((x,i)=>X(i)+','+Y(x)).join(' ')}"/>`;
    wk.forEach((k,i)=>{
      const on=cur&&m===curSem&&k.w.label===cur.w.label, ly=ms.length>1&&m==='S2'?Y(v[i])+20:Y(v[i])-10;
      o+=`<circle cx="${X(i)}" cy="${Y(v[i])}" r="${on?6:4}" fill="${on?LC[m]:'#fff'}" stroke="${LC[m]}" stroke-width="2"><title>${m==='S1'?'Semester 1':'Semester 2'} ${wLabel(k.w.label)} (${dm(k.w.start)}): ${v[i]} students${S.mode==='cum'?' so far':''}</title></circle>`;
      if(n<=14)o+=`<text x="${X(i)}" y="${ly}" text-anchor="middle" style="fill:${LC[m]};font-weight:600">${v[i]}</text>`;
    });
  });
  const ci=cur&&bySem[curSem]?bySem[curSem].indexOf(cur):-1;
  for(let i=0;i<n;i++){
    const k=(bySem.S1||[])[i]||(bySem.S2||[])[i];
    o+=`<text x="${X(i)}" y="${H-38}" text-anchor="middle" style="fill:#17222d;font-weight:${i===ci?700:400}">${wLabel(k.w.label)}</text>`;
    ms.forEach((m,j)=>{const w=(bySem[m]||[])[i]; if(w)o+=`<text x="${X(i)}" y="${H-24+j*13}" text-anchor="middle" style="fill:${LC[m]};font-size:10.5px">${dm(w.w.start)}</text>`});
  }
  return o+'</svg>';
}
function barChart(cur,cap){
  if(!cur) return '<p style="color:var(--mute)">No teaching timetable for this week.</p>';
  const W=720,H=300,l=44,r=10,t=12,b=58,pw=W-l-r,ph=H-t-b,y=v=>t+ph*(1-Math.min(v,cap)/cap);
  let o=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Seat occupancy by half day">`;
  [0,.25,.5,.75,1].forEach(f=>{const v=Math.round(cap*f);o+=`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="#dfe4e9"/><text x="${l-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`});
  cur.slots.forEach((s,i)=>{
    const gx=l+i*pw/5,gw=pw/5;
    o+=`<text x="${gx+gw/2}" y="${H-10}" text-anchor="middle" style="fill:#17222d;font-size:12px">${DN[i]} ${dm(s.d)}</text>`;
    [['AM',s.am],['PM',s.pm]].forEach(([nm,v],j)=>{
      const bx=gx+gw*(j?.55:.13),bw=gw*.32,occ=Math.min(v,cap),rem=cap-occ,over=v>cap;
      o+=`<g><title>${DN[i]} ${nm}: ${v} of ${cap} seats${over?' (over capacity)':''}</title><rect x="${bx}" y="${y(cap)}" width="${bw}" height="${ph*rem/cap}" fill="#cdeaf2"/><rect x="${bx}" y="${y(occ)}" width="${bw}" height="${ph*occ/cap}" fill="${over?'#c0392b':'#1f3a5f'}"/></g>`;
      if(occ>cap*.08) o+=`<text x="${bx+bw/2}" y="${y(occ)+16}" text-anchor="middle" style="fill:#fff;font-size:12px">${v}</text>`;
      else if(v>0) o+=`<text x="${bx+bw/2}" y="${y(occ)-4}" text-anchor="middle" style="fill:#17222d;font-size:12px">${v}</text>`;
      if(rem>cap*.08) o+=`<text x="${bx+bw/2}" y="${y(cap)+ph*rem/cap/2+4}" text-anchor="middle" style="fill:#3f86a6;font-weight:700;font-size:12px">${rem}</text>`;
      o+=`<text x="${bx+bw/2}" y="${t+ph+16}" text-anchor="middle">${nm}</text>`;
    });
  });
  return o+'</svg>';
}
function renderStats(){
  const cap=+S.cfg.capacity||100, cw=weekOf(mondayOf(S.date))||weekOf(S.date), sem=cw?cw.sem:S.cfg.defaultSemester||'S1';
  const bySem={}; ['S1','S2'].forEach(m=>bySem[m]=S.pat.filter(w=>w.sem===m&&w.type==='Teaching').map(weekData));
  const weeks=bySem[sem]||[], semName=sem==='S1'?'Semester 1':'Semester 2';
  const cur=cw&&cw.type==='Teaching'?weeks.find(x=>x.w.label===cw.label):null;
  const pk=weeks.reduce((a,x)=>x.total>a.total?x:a,{total:0,w:{label:''}});
  const ref=mondayOf(S.date), upto=weeks.filter(x=>x.w.start<=ref), sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
  const rng=upto.length?`${wLabel(upto[0].w.label)}–${wLabel(upto[upto.length-1].w.label)}`:'not started';
  const pct=a=>a.length?Math.round(100*a.reduce((t,v)=>t+Math.min(v,cap),0)/(cap*a.length)):0;
  const all=weeks.flatMap(x=>x.slots.flatMap(s=>[s.am,s.pm])), ex=weeks.flatMap(x=>x.slots.flatMap(s=>[s.am2,s.pm2])).filter(v=>v!==null);
  const wk=cur?cur.slots.flatMap(x=>[x.am,x.pm]):[], wkx=cur?cur.slots.flatMap(x=>[x.am2,x.pm2]).filter(v=>v!==null):[], fw=a=>cur?pct(a)+'%':'–';
  const tdx=upto.flatMap(x=>x.slots.flatMap(z=>[z.am2,z.pm2])).filter(v=>v!==null), td=tdx.length?pct(tdx)+'%':'–';
  const k=[[cur?cur.sessions:0,'sessions this week','Session blocks timetabled in the week on screen'],
    [sum(upto,x=>x.sessions),`sessions in ${semName} to date (${rng})`,'Running total for this semester only, from week 1 up to and including the week on screen'],
    [(cur?cur.total:0).toLocaleString(),'student places this week','Each student counts once for every session they are timetabled for'],
    [sum(upto,x=>x.total).toLocaleString(),`student places in ${semName} to date (${rng})`,'Running total for this semester only, from week 1 up to and including the week on screen'],
    [cur?cur.prep:0,'sessions this week not marked Prepared','Sessions in the week on screen whose Requirement Status is not Prepared'],
    [pk.total?wLabel(pk.w.label):'–','busiest week in '+semName+' ('+pk.total+' students)']];
  $('kpis').innerHTML=k.map(([a,b,t])=>`<div class="kpi" title="${t||''}"><b>${a}</b><span>${b}</span></div>`).join('')+
   `<div class="kpi wide"><div class="badge" title="Average of every half-day slot from W1 up to the week on screen, excluding Wed 12:00–17:00"><b>${td}</b><span>${semName} to date</span><small>${rng} · excl. Wed 12:00–17:00</small></div><div class="two"><div><b>${fw(wk)}</b><span>average seat use this week</span><small>${semName} average ${pct(all)}%</small></div><div><b>${fw(wkx)}</b><span>same, excluding Wed 12:00–17:00</span><small>${semName} average ${pct(ex)}%</small></div></div>
    <button class="info-i" data-note aria-expanded="${!!S.note}" aria-label="How average seat use is calculated">i</button>${S.note?`<p class="note">Week on screen: ${cur?wLabel(cur.w.label)+', '+dm(cur.w.start):'no teaching this week'}. Each week has 10 half-day slots (Mon–Fri, AM 09:00–13:00, PM 13:00–17:00). For each slot we take the peak number of students timetabled at the same moment, cap it at ${cap} seats and divide by ${cap}; empty slots count as 0%. The large figures are the average of the ${wk.length} slots of the week on screen, so they change as you move between weeks (the bars below show the same slots day by day). The second figure leaves out Wednesday 12:00–17:00: Wed AM is measured 09:00–12:00 and the Wed PM slot (13:00–17:00) is dropped, so it averages ${wkx.length} slots. The highlighted box at the top right averages the slots (excluding Wed 12:00–17:00) of every teaching week from W1 up to the week on screen (${tdx.length} slots so far). The “${semName} average” lines use the same calculation over all ${weeks.length} teaching weeks (${all.length} and ${ex.length} slots).</p>`:''}</div>`;
  document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===S.mode));
  document.querySelectorAll('[data-line]').forEach(b=>{const off=!S.lines[b.dataset.line];b.classList.toggle('off',off);b.setAttribute('aria-checked',!off)});
  $('lineChart').innerHTML=lineChart(bySem,cur,sem);
  $('barTitle').textContent=cw?`Seat occupancy · ${wLabel(cw.label)}, ${dm(cw.start)} – ${dm(addDays(cw.start,4))} (capacity ${cap})`:'Seat occupancy';
  $('barChart').innerHTML=barChart(cur,cap);
}

/* ---------- controls ---------- */
function step(dir){
  const d=new Date(S.date);
  if(S.view==='month') d.setMonth(d.getMonth()+dir,1);
  else if(S.view==='day'){ d.setDate(d.getDate()+dir); while((d.getDay()===0||d.getDay()===6)&&!S.weekends) d.setDate(d.getDate()+dir) }
  else d.setDate(d.getDate()+7*dir);
  S.date=d; render();
}
function jumpSem(sem){
  const w=S.pat.find(x=>x.sem===sem&&x.type==='Teaching'); if(w){S.date=new Date(w.start); render()}
}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('button, #ov'); if(!t) return;
  if(t.id==='ov'||t.id==='cls') return closeDlg();
  if(t.dataset.k) return showDetail(t.dataset.k);
  if(t.dataset.note!==undefined){S.note=!S.note; return render()}
  if(t.dataset.line){S.lines[t.dataset.line]=!S.lines[t.dataset.line]; return render()}
  if(t.dataset.mode){S.mode=t.dataset.mode; return render()}
  if(t.dataset.hide){S.hide.has(t.dataset.hide)?S.hide.delete(t.dataset.hide):S.hide.add(t.dataset.hide); renderLegend(); render(); return}
  if(t.dataset.view){S.view=t.dataset.view; if(S.view==='day'&&!weekOf(S.date)) {} render(); return}
  if(t.dataset.sem) return jumpSem(t.dataset.sem);
  if(t.id==='prev') step(-1); else if(t.id==='next') step(1);
  else if(t.id==='today'){S.date=new Date(); render()}
  else if(t.id==='wk'){S.weekends=!S.weekends; t.textContent=S.weekends?'Hide Weekends':'Show Weekends'; render()}
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDlg() });

/* ---------- start ---------- */
async function init(){
  try{
    const get=async(u)=>{const r=await fetch(u); if(!r.ok) throw new Error(u+' ('+r.status+')'); return r.text()};
    const [p,t,c]=await Promise.all([get('Week-Pattern-AY2627.csv'),get('AICE-Timetable-AY2627.csv'),get('config.json').catch(()=>'{}')]);
    loadPattern(p); S.tt=toObjs(parseCSV(t),true); Object.assign(S.cfg,JSON.parse(c||'{}')); S.progs=[...new Set(S.tt.map(r=>r['Programmes']))];
  }catch(err){
    $('title').textContent='Could not load data';
    $('status').textContent=err.message+' – open this page through a web server (e.g. python -m http.server), not by double-clicking the file.';
    return;
  }
  if(!weekOf(new Date())){ const w=S.pat.find(x=>x.sem===S.cfg.defaultSemester&&x.type==='Teaching'); if(w) S.date=new Date(w.start) }
  if(matchMedia('(max-width:700px)').matches) S.view='day';
  renderLegend(); render();
}
init();
})();
</script>
